#	@(#)rc.conf	1.1 (2.11BSD) 2026/10/7
#

# The following values should all be set to YES or NO

rc_configured=NO

rwhod=NO		# Run rwho daemon
named=NO		# Run local DNS server
sendmail=YES		# Run local sendmail
ntpd=NO 		# Run ntpd daemon
ntp=NO			# Set system time at boot using ntp
timed=NO		# Run timed daemon

# Host definitions and network interface selection. IMPORTANT: The values
# set here may also require changes to /etc/hosts and /etc/resolv.conf

# hostname is the symbolic name of this host (address set in /etc/hosts)
# address is the network address of this host
# netmask is network mask, generally assigned by your ISP or router
# gateway should be set to the IP address where this host will send packets
#	to hosts not on your local LAN, generally assigned by your ISP or
#	router
# interface should be the actual interface on your machine
#       de0 for Unibus
#       qe0 for Qbus
#	qt0 for Qbus
#	This normally is not needed to be set. It will by default
#	be set to de0 or qe0 based on machine type.

# hostname=pidp.example.com
# address=192.168.0.40
# netmask=255.255.255.0
# gateway=192.168.0.1
# interface=de0

#
# DON'T EVEN THINK ABOUT RUNNING ROUTED ON A PDP-11!!!  Just set routedflags
# to "NO" and set up a default gateway.
#
# routedflags=NO
